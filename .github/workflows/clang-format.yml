name: Clang Format

on:
  push:
    branches: [main]
    paths:
      - '**/*.cc'
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.hpp'
      - '.clang-format'
      - '.github/workflows/clang-format.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.cc'
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.hpp'
      - '.clang-format'
      - '.github/workflows/clang-format.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: Check Code Format
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install clang-format 19.1.5 via pip
        run: pip install clang-format==19.1.5

      - name: Run clang-format check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || echo "$base" | grep -Eq '^0+$'; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          output="$(git clang-format --diff "$base" "${{ github.sha }}" --extensions c,cc,cpp,cxx,h,hh,hpp,hxx -- src tests)"
          echo "$output"
          if [ -n "$output" ] && ! echo "$output" | grep -Eq "clang-format did not modify any files|no modified files to format"; then
            echo "::error::clang-format would modify changed lines"
            exit 1
          fi
