name: Linux Tests

# Runs after a successful Linux Build and rebuilds debug for test binaries.
# sccache should make the rebuild incremental instead of a full compile.
on:
  workflow_run:
    workflows: ["Linux Build"]
    types: [completed]

concurrency:
  group: tests-linux-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  test:
    name: Build + Tests
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install GCC 13 + Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 ninja-build
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: .sccache
          key: sccache-linux-debug-${{ github.event.workflow_run.head_sha }}
          restore-keys: |
            sccache-linux-debug-

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-linux-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            nuget-linux-

      - name: Restore .NET packages
        shell: bash
        run: |
          shopt -s globstar nullglob
          for proj in src/**/*.csproj tests/**/*.csproj samples/**/*.csproj; do
            dotnet restore "$proj"
          done

      - name: Configure
        env:
          SCCACHE_DIR: ${{ github.workspace }}/.sccache
        # ATLAS_BUILD_NET_CLIENT=ON pulls in atlas_test_helpers, the
        # P/Invoke surface for the Atlas.Client.IntegrationTests step below.
        run: >
          cmake --preset debug
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DATLAS_BUILD_NET_CLIENT=ON

      - name: Build
        env:
          SCCACHE_DIR: ${{ github.workspace }}/.sccache
        shell: bash
        run: |
          set +e
          cmake --build build/debug --config Debug --parallel 2 2>&1 | tee build-test.log
          status=${PIPESTATUS[0]}
          if [[ "$status" -ne 0 ]]; then
            error_regex='(^FAILED:| error:|fatal error:|undefined reference|collect2:|ld:|ninja:|CMake Error|No such file|Killed)'
            report=build-test-failure.txt
            if grep -nEi "$error_regex" build-test.log > "$report.matches"; then
              : > "$report"
              while IFS=: read -r line _; do
                start=$((line > 8 ? line - 8 : 1))
                end=$((line + 20))
                sed -n "${start},${end}p" build-test.log >> "$report"
                echo "..." >> "$report"
              done < <(head -n 8 "$report.matches")
            else
              tail -n 80 build-test.log > "$report"
            fi
            {
              echo "### Linux test build failure"
              echo '```text'
              cat "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail_output="$(head -n 120 "$report")"
            tail_output="${tail_output//'%'/'%25'}"
            tail_output="${tail_output//$'\r'/'%0D'}"
            tail_output="${tail_output//$'\n'/'%0A'}"
            echo "::error title=Linux test build failed::$tail_output"
            exit "$status"
          fi

      - name: sccache stats
        env:
          SCCACHE_DIR: ${{ github.workspace }}/.sccache
        run: sccache --show-stats

      - name: Unit Tests
        working-directory: build/debug
        shell: bash
        run: |
          set +e
          ctest --build-config Debug --label-regex unit --output-on-failure 2>&1 | tee unit-tests.log
          status=${PIPESTATUS[0]}
          if [[ "$status" -ne 0 ]]; then
            {
              echo "### Linux unit test failure"
              echo '```text'
              tail -n 200 unit-tests.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Integration Tests
        working-directory: build/debug
        shell: bash
        run: |
          set +e
          ctest --build-config Debug --label-regex integration --output-on-failure 2>&1 | tee integration-tests.log
          status=${PIPESTATUS[0]}
          if [[ "$status" -ne 0 ]]; then
            {
              echo "### Linux integration test failure"
              echo '```text'
              tail -n 200 integration-tests.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: C# IntegrationTests
        env:
          ATLAS_BIN_DIR: ${{ github.workspace }}/bin/debug
        shell: bash
        run: |
          set +e
          dotnet test tests/csharp/Atlas.Client.IntegrationTests --filter "Category!=Nightly" --nologo \
            2>&1 | tee csharp-integration-tests.log
          status=${PIPESTATUS[0]}
          if [[ "$status" -ne 0 ]]; then
            {
              echo "### Linux C# integration test failure"
              echo '```text'
              tail -n 200 csharp-integration-tests.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
