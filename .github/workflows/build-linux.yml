name: Linux Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'tools/profile/**'
      - 'tools/cluster_control/**'
      - '.gitignore'
      - 'memory/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'tools/profile/**'
      - 'tools/cluster_control/**'
      - '.gitignore'
      - 'memory/**'

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: debug
            config: Debug
          - preset: profile
            config: RelWithDebInfo
          - preset: release
            config: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install GCC 13 + Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 ninja-build
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: .sccache
          key: sccache-linux-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            sccache-linux-${{ matrix.preset }}-

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-linux-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            nuget-linux-

      - name: Restore .NET packages
        shell: bash
        run: |
          shopt -s globstar nullglob
          for proj in src/**/*.csproj tests/**/*.csproj samples/**/*.csproj; do
            dotnet restore "$proj"
          done

      - name: Configure
        env:
          SCCACHE_DIR: ${{ github.workspace }}/.sccache
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DATLAS_BUILD_TESTS=OFF

      - name: Build
        env:
          SCCACHE_DIR: ${{ github.workspace }}/.sccache
        shell: bash
        run: |
          set +e
          cmake --build build/${{ matrix.preset }} --config ${{ matrix.config }} 2>&1 \
            | tee build-${{ matrix.preset }}.log
          status=${PIPESTATUS[0]}
          if [[ "$status" -ne 0 ]]; then
            {
              echo "### Linux ${{ matrix.preset }} build failure"
              echo '```text'
              tail -n 200 build-${{ matrix.preset }}.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail_output="$(tail -n 120 build-${{ matrix.preset }}.log)"
            tail_output="${tail_output//'%'/'%25'}"
            tail_output="${tail_output//$'\r'/'%0D'}"
            tail_output="${tail_output//$'\n'/'%0A'}"
            echo "::error title=Linux ${{ matrix.preset }} build failed::$tail_output"
            exit "$status"
          fi

      - name: sccache stats
        env:
          SCCACHE_DIR: ${{ github.workspace }}/.sccache
        run: sccache --show-stats
